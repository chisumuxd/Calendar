<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บันทึกชั่วโมงทำงาน</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<style>
  :root{--pink:#ffb6c8;--pink2:#ffe4ec;--hot:#ff7aa2;--mint:#c8f0e0;--sky:#d6ecff;--lemon:#fff6c7;--text:#6b4a5a}
  [hidden]{display:none!important}
  body{font-family:'Mali',system-ui,sans-serif;max-width:900px;margin:auto;padding:16px;color:var(--text);
    background:#fff5f8 radial-gradient(#ffd6e3 1.5px,transparent 1.5px) 0 0/22px 22px}
  h1{text-align:center;color:var(--hot);margin:8px 0 16px;font-size:1.6rem}
  .card{max-width:320px;margin:40px auto;background:#fff;border-radius:24px;padding:24px;box-shadow:0 6px 0 var(--pink);display:flex;flex-direction:column;gap:10px;text-align:center}
  .card h2{margin:0 0 6px;color:var(--hot)}
  .card input{font:inherit;padding:10px 14px;border:2px dashed var(--pink);border-radius:14px;color:var(--text);background:#fffafb}
  .card input:focus{outline:none;border-style:solid;border-color:var(--hot)}
  #msg{color:#e0457b;margin:0;min-height:1.2em;font-size:.9rem}
  .btn{font:inherit;font-size:1rem;padding:10px;border:none;border-radius:999px;background:var(--hot);color:#fff;cursor:pointer}
  .btn.alt{background:var(--mint);color:var(--text)}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
  .bar .btn{padding:6px 14px;font-size:.85rem;flex-shrink:0}
  #who{word-break:break-all}
  #status{font-size:.8rem}
  header{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:24px;padding:6px 10px;box-shadow:0 4px 0 var(--pink)}
  header h2{margin:0;font-size:1.3rem}
  header button{font:inherit;font-size:1.4rem;width:44px;height:44px;border:none;border-radius:50%;background:var(--pink);color:#fff;cursor:pointer;transition:transform .15s}
  header button:hover{transform:scale(1.1) rotate(-8deg)}
  #grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:16px 0}
  .h{text-align:center;font-weight:700;font-size:.85rem;padding:4px 0;border-radius:12px;background:var(--sky)}
  .h:first-child,.h:nth-child(7){background:var(--pink2)}
  .d{background:#fff;border:2px solid var(--pink2);border-radius:16px;padding:6px 4px;font-size:.8rem;text-align:center;transition:transform .15s}
  .d:hover{transform:translateY(-2px)}
  .d.has{background:var(--lemon)}
  .d.today{border-color:var(--hot);box-shadow:0 0 0 3px var(--pink2)}
  .d.today b::after{content:' 🌸'}
  .d input{width:100%;box-sizing:border-box;margin-top:3px;font:inherit;font-size:.8rem;text-align:center;border:1.5px dashed var(--pink);border-radius:10px;padding:2px;background:#fffafb;color:var(--text);-moz-appearance:textfield}
  .d input::-webkit-inner-spin-button,.d input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  .d input[data-i="1"]{border-color:#9ad9c0;background:#f3fcf8}
  .d input:focus{outline:none;border-style:solid;border-color:var(--hot)}
  h3{color:var(--hot);margin:20px 0 8px}
  .sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .sum div{background:#fff;border-radius:20px;padding:12px 6px;text-align:center;font-size:.85rem;box-shadow:0 4px 0 var(--mint)}
  .sum div:nth-child(2){box-shadow:0 4px 0 var(--sky)}
  .sum div:nth-child(3){box-shadow:0 4px 0 #ffe08a;background:var(--lemon)}
  .sum b{display:block;font-size:1.5rem;margin-top:4px;color:var(--hot)}
</style>
</head>
<body>
<h1>🐰 บันทึกชั่วโมงทำงาน ✨</h1>

<form id="login" class="card">
  <h2>🔐 เข้าสู่ระบบ</h2>
  <input id="email" type="email" placeholder="อีเมล" autocomplete="email" aria-label="อีเมล">
  <input id="pass" type="password" placeholder="รหัสผ่าน (6 ตัวขึ้นไป)" autocomplete="current-password" aria-label="รหัสผ่าน">
  <p id="msg" role="alert"></p>
  <button class="btn">เข้าสู่ระบบ</button>
  <button class="btn alt" type="button" id="signup">สมัครใหม่</button>
</form>

<main id="app" hidden>
  <div class="bar"><span>👋 <b id="who"></b> <span id="status" role="status"></span></span><button class="btn alt" type="button" id="logout">ออกจากระบบ</button></div>
  <header><button id="prev" aria-label="เดือนก่อน">‹</button><h2 id="title"></h2><button id="next" aria-label="เดือนถัดไป">›</button></header>
  <div id="grid"></div>

  <h3>🍓 สรุปเดือนนี้</h3>
  <div class="sum"><div>⏰ ชั่วโมงทำงาน<b id="mW"></b></div><div>🌙 โอที (ชม.)<b id="mO"></b></div><div>💰 เงินโอที (บาท)<b id="mM"></b></div></div>
  <h3>🧁 รวมทั้งหมด</h3>
  <div class="sum"><div>⏰ ชั่วโมงทำงาน<b id="tW"></b></div><div>🌙 โอที (ชม.)<b id="tO"></b></div><div>💰 เงินโอที (บาท)<b id="tM"></b></div></div>
</main>

<!--
  ตารางใน Supabase (วางใน SQL Editor แล้วกด Run ครั้งเดียว):

  create table work_hours (
    user_id uuid not null references auth.users on delete cascade,
    day date not null,
    work numeric not null default 0 check (work between 0 and 24),
    ot numeric not null default 0 check (ot between 0 and 24),
    primary key (user_id, day)
  );
  alter table work_hours enable row level security;
  create policy "own rows" on work_hours for all
    using (auth.uid() = user_id) with check (auth.uid() = user_id);
-->
<script>
// ใส่ค่าจาก Supabase → Project Settings → API (key นี้เปิดเผยได้ ข้อมูลถูกกันด้วย row level security)
const SUPABASE_URL = 'https://dyvybduliytimvcjoucm.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5dnliZHVsaXl0aW12Y2pvdWNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxMDI4MzgsImV4cCI6MjEwNzY3ODgzOH0.RbM5XQVeJy1Wv0w5cyeMBc3RXMpIlSKmHPlE2DQfn4A';
const RATE = 75; // บาท ต่อ ชม. โอที

const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString('th-TH');
const key = (y, m, d) => `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const status = t => { $('status').textContent = t; };

// persistSession: false → ไม่จำการเข้าสู่ระบบ รีเฟรช/ปิดเว็บแล้วต้องเข้าใหม่
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });
const TH = {
  'Invalid login credentials': 'อีเมลหรือรหัสผ่านไม่ถูกต้อง',
  'User already registered': 'อีเมลนี้สมัครไว้แล้ว',
  'Email not confirmed': 'ยังไม่ได้กดลิงก์ยืนยันในอีเมล',
};

let uid = null, data = {}; // data = { "2026-10-16": [ชม.งาน, ชม.โอที] }

async function enter(isNew) {
  const msg = t => { $('msg').textContent = t; };
  const email = $('email').value.trim(), password = $('pass').value;
  if (SUPABASE_URL.includes('xxxx')) return msg('ยังไม่ได้ใส่ SUPABASE_URL / KEY ในไฟล์');
  if (!email || !password) return msg('กรอกอีเมลและรหัสผ่านก่อนนะ');
  msg('รอสักครู่…');
  const { data: auth, error } = isNew
    ? await sb.auth.signUp({ email, password })
    : await sb.auth.signInWithPassword({ email, password });
  if (error) return msg(TH[error.message] || error.message);
  if (!auth.session) return msg('📧 ส่งลิงก์ยืนยันไปที่อีเมลแล้ว กดยืนยันแล้วกลับมาเข้าสู่ระบบนะ');
  uid = auth.user.id;

  const old = load('workhours'); // ข้อมูลจากเวอร์ชันแรกที่เก็บไว้ในเครื่อง
  if (old && confirm('พบข้อมูลเดิมในเครื่องนี้ ย้ายเข้าบัญชีนี้ไหม?')) {
    const rows = Object.entries(old).map(([day, [work, ot]]) => ({ user_id: uid, day, work, ot }));
    const { error } = await sb.from('work_hours').upsert(rows);
    if (error) return msg('ย้ายข้อมูลเดิมไม่สำเร็จ: ' + error.message);
    localStorage.removeItem('workhours');
  }

  // ponytail: Supabase ส่งได้ทีละ 1,000 แถว = ~1,000 วันที่มีข้อมูล เกินนั้นค่อยแบ่งหน้า (.range) หรือรวมยอดใน SQL
  const { data: rows, error: loadErr } = await sb.from('work_hours').select('day, work, ot');
  if (loadErr) return msg('โหลดข้อมูลไม่สำเร็จ: ' + loadErr.message);
  data = Object.fromEntries(rows.map(r => [r.day, [+r.work, +r.ot]]));

  msg(''); $('pass').value = '';
  $('who').textContent = email;
  $('login').hidden = true; $('app').hidden = false;
  render();
}

// บันทึกทีละวัน หลังหยุดพิมพ์ 0.6 วิ — ต่อคิวรายวันเพื่อไม่ให้คำขอเก่ามาทับค่าใหม่
const timers = {}, chains = {}, unsaved = new Set();
const queueSave = k => { clearTimeout(timers[k]); timers[k] = setTimeout(() => flush(k), 600); };
function flush(k) {
  clearTimeout(timers[k]); delete timers[k];
  return chains[k] = (chains[k] || Promise.resolve()).then(async () => {
    const [work, ot] = data[k] || [];
    const { error } = data[k]
      ? await sb.from('work_hours').upsert({ user_id: uid, day: k, work, ot })
      : await sb.from('work_hours').delete().eq('user_id', uid).eq('day', k);
    if (error) unsaved.add(k); else if (!timers[k]) unsaved.delete(k);
    status(error ? '⚠️ บันทึกไม่สำเร็จ: ' + error.message : unsaved.size ? '💾 กำลังบันทึก…' : '✅ บันทึกแล้ว');
  });
}

const view = new Date(); view.setDate(1);

function render() {
  const y = view.getFullYear(), m = view.getMonth(), now = new Date();
  const todayKey = key(now.getFullYear(), now.getMonth(), now.getDate());
  $('title').textContent = view.toLocaleDateString('th-TH', { month: 'long', year: 'numeric' });
  let html = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'].map(d => `<div class="h">${d}</div>`).join('')
    + '<div></div>'.repeat(new Date(y, m, 1).getDay());
  for (let d = 1, n = new Date(y, m + 1, 0).getDate(); d <= n; d++) {
    const k = key(y, m, d), [w, o] = data[k] || [];
    html += `<div class="d${k === todayKey ? ' today' : ''}${data[k] ? ' has' : ''}"><b>${d}</b>
      <input type="number" min="0" max="24" step="0.5" inputmode="decimal" data-k="${k}" data-i="0" value="${w || ''}" placeholder="ชม.งาน" aria-label="ชั่วโมงทำงานวันที่ ${d}">
      <input type="number" min="0" max="24" step="0.5" inputmode="decimal" data-k="${k}" data-i="1" value="${o || ''}" placeholder="OT" aria-label="โอทีวันที่ ${d}">
    </div>`;
  }
  $('grid').innerHTML = html;
  summary();
}

function summary() {
  const prefix = key(view.getFullYear(), view.getMonth(), 1).slice(0, 8); // "2026-10-"
  let mw = 0, mo = 0, tw = 0, to = 0;
  for (const [k, [w, o]] of Object.entries(data)) {
    tw += w; to += o;
    if (k.startsWith(prefix)) { mw += w; mo += o; }
  }
  $('mW').textContent = fmt(mw); $('mO').textContent = fmt(mo); $('mM').textContent = fmt(mo * RATE);
  $('tW').textContent = fmt(tw); $('tO').textContent = fmt(to); $('tM').textContent = fmt(to * RATE);
}

$('grid').oninput = e => {
  const { k, i } = e.target.dataset;
  const v = data[k] || [0, 0];
  v[i] = Math.min(24, Math.max(0, parseFloat(e.target.value) || 0));
  if (v[0] || v[1]) data[k] = v; else delete data[k];
  e.target.parentNode.classList.toggle('has', !!data[k]);
  unsaved.add(k); queueSave(k); status('💾 กำลังบันทึก…');
  summary();
};
$('login').onsubmit = e => { e.preventDefault(); enter(false); };
$('signup').onclick = () => enter(true);
$('logout').onclick = async () => {
  status('💾 กำลังบันทึก…');
  await Promise.all(Object.keys(timers).map(k => flush(k)));
  await Promise.all(Object.values(chains));
  if (unsaved.size && !confirm('ยังบันทึกบางวันไม่สำเร็จ ออกเลยไหม?')) return;
  await sb.auth.signOut();
  location.reload(); // ล้างทุกอย่างในหน่วยความจำ กลับหน้าเข้าสู่ระบบ
};
addEventListener('beforeunload', e => { if (unsaved.size) { e.preventDefault(); e.returnValue = ''; } });
$('prev').onclick = () => { view.setMonth(view.getMonth() - 1); render(); };
$('next').onclick = () => { view.setMonth(view.getMonth() + 1); render(); };
</script>
</body>
</html>
